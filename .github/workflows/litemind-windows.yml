name: LiteMind Windows build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --ignore-scripts
      - name: Engine tests
        working-directory: packages/litemind-engine
        run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install
      # Версия сборки: из тега (v0.3.1 -> 0.3.1), для веток — 0.3.0 / 0.3.0-dev.
      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "version=0.3.0-dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.3.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build CLI sidecar
        working-directory: packages/cli
        run: bun run build
      - name: Build desktop
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
        run: bun run build
      - name: Package NSIS installer (x64)
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          # Ресурсы electron-builder (winCodeSign, NSIS) качаются с зеркала npmmirror:
          # GitHub Releases периодически отдаёт 504 (два прогона подряд).
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts
      # Portable-таргет временно не собирается: патч апстрима app-builder-lib
      # использует ${DirState} из assisted-шаблона, которого нет в oneClick/portable.
      - name: List build output (verification)
        shell: pwsh
        run: Get-ChildItem packages/desktop/dist -Filter *.exe | Select-Object Name, Length
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litemind-desktop-win-x64
          path: |
            packages/desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: [test, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          name: litemind-desktop-win-x64
          path: dist
      - name: Verify artifacts exist and are non-empty
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.exe' -size +10M)" || { echo '::error::No substantial .exe found in artifacts'; exit 1; }
      - name: Compute SHA-256 checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiteMind Engine ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

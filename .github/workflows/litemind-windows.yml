name: LiteMind Windows build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --ignore-scripts
      - name: Engine tests
        working-directory: packages/litemind-engine
        run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install
      - name: Build CLI sidecar
        working-directory: packages/cli
        run: bun run build
      - name: Build desktop
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ github.ref_name == 'main' && '0.3.0' || '0.3.0-dev' }}
        run: bun run build
      - name: Package (NSIS + portable, x64)
        working-directory: packages/desktop
        run: bun run pack -- --win --x64 --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litemind-desktop-win-x64
          path: |
            packages/desktop/dist/*.exe
          if-no-files-found: error

name: LiteMind Windows build

# Этап 2: job «smoke» — проверка УСТАНОВЛЕННОГО артефакта успешной сборки на
# чистом windows-latest раннере. Включается только вручную (workflow_dispatch
# с input smoke=true); обычная сборка/релиз работают как раньше.
# Отдельный workflow-файл для smoke не зарегистрировать, пока он не попадёт
# в default-ветку, поэтому проверка живёт здесь (файл из ref запуска).

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      - '.github/**'
      - '**/*.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Запустить smoke-тест установленного артефакта (без пересборки)'
        type: boolean
        default: false
      run_id:
        description: 'Run ID сборки с артефактом litemind-desktop-win-x64'
        default: '42790596165'
      expected_sha256:
        description: 'Ожидаемый SHA-256 установщика (нижний регистр)'
        default: '86efd694800bbd2a7685cdd027648cfd405916429793c86980bddcaf14f0883e'
      model_url:
        description: 'URL GGUF-модели для теста (та же, что у пользователя)'
        default: 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf'

permissions:
  contents: write

jobs:
  test:
    if: inputs.smoke != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun строго той версии, что закреплена в packageManager (bun@1.4.4) —
      # из npm-реестра: GitHub Releases периодически отдаёт 504 (инцидент 2026-11-08).
      - name: Install bun 1.4.4 (npm registry)
        run: npm install -g bun@1.4.4
      - run: bun install --ignore-scripts
      - name: Engine tests
        working-directory: packages/litemind-engine
        run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    if: github.event_name != 'pull_request' && inputs.smoke != true
    steps:
      - uses: actions/checkout@v4
      - name: Install bun 1.4.4 (npm registry)
        run: npm install -g bun@1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install
      # Версия сборки: из тега (v0.5.0 -> 0.5.0), для веток — из package.json
      # (источник истины), с суффиксом -dev для ветки dev.
      - name: Derive version
        id: ver
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./packages/litemind-engine/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "version=${PKG_VERSION}-dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build CLI sidecar
        working-directory: packages/cli
        run: bun run build
      # Собственный runtime v0.4+: llama.cpp без AVX/AVX2 как ТРЕБОВАНИЕ
      # совместимости (целевой CPU — Intel N5095A/Tremont), но с GGML_CPU_ALL_VARIANTS:
      # в комплект кладутся варианты CPU-ядра (x64/sse42/avx2/...), и runtime сам
      # выбирает лучший вариант, который поддерживает процессор пользователя.
      # На N5095A будет задействован sse42 (быстрее базового x86-64),
      # на AVX2-машинах — haswell. Сборка остаётся полностью работоспособной
      # на CPU без AVX (ТЗ Этапа 2 §4: проверка реальных инструкций, а не запрет).
      # ВАЖНО: BUILD_SHARED_LIBS не выключаем — upstream требует общие библиотеки
      # для GGML_BACKEND_DL (ggml/src/CMakeLists.txt: «GGML_BACKEND_DL requires
      # BUILD_SHARED_LIBS», падение CI 2026-11-10). Все ggml*.dll копируются рядом
      # с exe и попадают в установщик тем же шагом.
      - name: Build llama.cpp runtime (no AVX baseline + runtime CPU variants)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp "$env:RUNNER_TEMP\llamacpp-src"
          # GGML_BMI2: при GGML_NATIVE=OFF дефолтится в ON (ShlX/BZHI/PEXT — Haswell+);
          # на целевом N5095A (Tremont) BMI2 НЕТ — GCC вставляет ShlX в неохраняемые
          # циклы (fp16-таблица), MSVC — не гарантирует отсутствие. Явно OFF (см. скан #52).
          cmake -S "$env:RUNNER_TEMP\llamacpp-src" -B "$env:RUNNER_TEMP\llamacpp-build" `
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_SSE42=OFF `
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF `
            -DGGML_AVX_VNNI=OFF -DGGML_BMI2=OFF `
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TOOLS=ON -DLLAMA_CURL=OFF `
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON
          cmake --build "$env:RUNNER_TEMP\llamacpp-build" --config Release --target llama-server
          New-Item -ItemType Directory -Force packages/desktop/resources/llamacpp | Out-Null
          $exe = Get-ChildItem "$env:RUNNER_TEMP\llamacpp-build\bin" -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw 'llama-server.exe was not built' }
          Copy-Item $exe.FullName packages/desktop/resources/llamacpp/llama-server.exe
          # BACKEND_DL + общие библиотеки: ggml-бэкенды и варианты CPU (ggml-cpu-*.dll)
          # идут отдельными DLL рядом с exe — копируем их все.
          Get-ChildItem $exe.DirectoryName -Filter *.dll | ForEach-Object { Copy-Item $_.FullName packages/desktop/resources/llamacpp/ }
          Get-ChildItem packages/desktop/resources/llamacpp | Select-Object Name, Length
      # ── Runtime-зависимости (ТЗ v0.6.2 §1): фикс 0xC0000135 на чистой Windows 11.
      # llama-server-impl.dll импортирует libssl-3-x64.dll/libcrypto-3-x64.dll
      # (OpenSSL, найденный CMake на раннере), ggml-base.dll и ggml-cpu-*.dll —
      # VCOMP140.DLL (OpenMP). На машине пользователя без VC++ Redistributable
      # всё это отсутствует → llama-server умирал за 0,4 с (код 3221225781 =
      # 0xC0000135 STATUS_DLL_NOT_FOUND), Electron при этом работал (статически
      # слинкован). Решение — app-local deployment: кладём DLL рядом с exe.
      - name: Bundle VC++ runtime and OpenSSL DLLs (app-local)
        shell: pwsh
        run: |
          $err = @()
          $sys = "$env:SystemRoot\System32"
          $vc = 'msvcp140.dll','msvcp140_codecvt_ids.dll','vcruntime140.dll','vcruntime140_1.dll','vcomp140.dll'
          $llamaDir = 'packages/desktop/resources/llamacpp'
          $sdDir = 'packages/desktop/resources/sd'
          # sdDir создаём заранее: этот шаг идёт ДО сборки stable-diffusion.cpp,
          # которая создаёт каталог сама (прогон v0.6.2 №1: Copy-Item падал с
          # «The directory name is invalid» и валил весь шаг).
          New-Item -ItemType Directory -Force $llamaDir, $sdDir | Out-Null
          foreach ($f in $vc) {
            $src = Join-Path $sys $f
            if (Test-Path $src) {
              Copy-Item $src $llamaDir/ -Force
              Copy-Item $src $sdDir/ -Force
            } else { $err += "VC++ runtime не найден в System32: $f" }
          }
          # OpenSSL 3: locate libssl-3-x64.dll / libcrypto-3-x64.dll на раннере.
          # Источник №1 — CMakeCache сборки llama.cpp: FindOpenSSL записывает туда
          # OPENSSL_INCLUDE_DIR, значит сами DLL лежат в <каталог>\bin. Это ровно
          # та OpenSSL, с которой llama-server был слинкован (поиск по всему диску
          # мог бы найти чужую версию — риск 0xC000007B/смешанных версий).
          $sslDir = $null
          $cache = "$env:RUNNER_TEMP\llamacpp-build\CMakeCache.txt"
          if (Test-Path $cache) {
            $m = Select-String -Path $cache -Pattern '^OPENSSL_INCLUDE_DIR:PATH=(.+)$' | Select-Object -First 1
            if ($m) {
              # <root>\include → <root>\bin (C:/Strawberry/c/include → C:/Strawberry/c/bin)
              $bin = Join-Path (Split-Path (Split-Path $m.Matches[0].Groups[1].Value -Parent) -Parent) 'bin'
              if (Test-Path (Join-Path $bin 'libssl-3-x64.dll')) { $sslDir = $bin }
            }
          }
          # Источник №2 — известные каталоги установки OpenSSL/Strawberry Perl.
          if (-not $sslDir) {
            foreach ($cand in "$env:ProgramFiles\OpenSSL\bin", "$env:ProgramFiles\OpenSSL-Win64\bin", 'C:\Strawberry\c\bin', "$env:ProgramFiles\CMake\bin") {
              if (Test-Path (Join-Path $cand 'libssl-3-x64.dll')) { $sslDir = $cand; break }
            }
          }
          # Источник №3 — ограниченный поиск по диску (последний шанс).
          if (-not $sslDir) {
            $hit = Get-ChildItem 'C:\Program Files','C:\Strawberry','C:\vcpkg' -Recurse -Depth 4 -Filter 'libssl-3-x64.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { $hit = Get-ChildItem "$env:RUNNER_TEMP" -Recurse -Depth 5 -Filter 'libssl-3-x64.dll' -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if ($hit) { $sslDir = $hit.DirectoryName }
          }
          if ($sslDir) {
            foreach ($f in 'libssl-3-x64.dll','libcrypto-3-x64.dll') {
              $src = Join-Path $sslDir $f
              if (Test-Path $src) { Copy-Item $src $llamaDir/ -Force }
              else { $err += "OpenSSL DLL не найден: $src" }
            }
          } else { $err += 'Каталог OpenSSL не найден на раннере' }
          if ($err.Count) { $err | ForEach-Object { Write-Host "::error::$_" }; throw "Недостающие runtime DLL: $($err -join '; ')" }
          Write-Host "OpenSSL взят из: $sslDir"
          Get-ChildItem $llamaDir, $sdDir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
      # ── Генератор изображений (ТЗ v0.6.1 §3): бэкенд stable-diffusion.cpp.
      # Собирается так же, как llama.cpp: БЕЗ AVX/AVX2 (целевой CPU N5095A/
      # Tremont), один CLI-процесс на генерацию, порт не занимает.
      - name: Build stable-diffusion.cpp runtime (no AVX)
        shell: pwsh
        run: |
          git clone https://github.com/leejet/stable-diffusion.cpp "$env:RUNNER_TEMP\sd-src"
          git -C "$env:RUNNER_TEMP\sd-src" checkout 32d516c
          # ggml (leejet/ggml) и остальные зависимости — субмодули. Без
          # `submodule update --init --recursive` каталог ggml пуст и CMake
          # падает на add_subdirectory (прогон №49, 2026-11-12).
          git -C "$env:RUNNER_TEMP\sd-src" submodule update --init --recursive
          cmake -S "$env:RUNNER_TEMP\sd-src" -B "$env:RUNNER_TEMP\sd-build" `
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF -DGGML_SSE42=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF `
            -DGGML_AVX_VNNI=OFF -DGGML_BMI2=OFF `
            -DSD_BUILD_SERVER=OFF -DSD_BUILD_EXAMPLES=ON
          # На коммите 32d516c CLI-таргет называется sd-cli (файл sd-cli.exe),
          # таргета "sd" больше нет — прогон №50 падал на MSB1009 sd.vcxproj.
          cmake --build "$env:RUNNER_TEMP\sd-build" --config Release --target sd-cli
          New-Item -ItemType Directory -Force packages/desktop/resources/sd | Out-Null
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sd-build\bin" -Recurse -Filter sd-cli.exe | Select-Object -First 1
          if (-not $exe) { throw 'sd-cli.exe was not built' }
          # Движок (src/image/sdbin.js) ищет sd.exe — кладём в комплект под этим именем.
          Copy-Item $exe.FullName packages/desktop/resources/sd/sd.exe
          Get-ChildItem $exe.DirectoryName -Filter *.dll | ForEach-Object { Copy-Item $_.FullName packages/desktop/resources/sd/ }
          Get-ChildItem packages/desktop/resources/sd | Select-Object Name, Length

      - name: Build desktop
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
        run: bun run build
      - name: Package NSIS installer (x64)
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          # Ресурсы electron-builder (winCodeSign, NSIS) качаются с зеркала npmmirror:
          # GitHub Releases периодически отдаёт 504 (два прогона подряд).
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          # Zip дистрибутива Electron тоже качается с GitHub Releases — зеркало снимает зависимость от его стабильности.
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts
      # Portable-таргет временно не собирается: патч апстрима app-builder-lib
      # использует ${DirState} из assisted-шаблона, которого нет в oneClick/portable.
      - name: List build output (verification)
        shell: pwsh
        run: Get-ChildItem packages/desktop/dist -Filter *.exe | Select-Object Name, Length
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litemind-desktop-win-x64
          path: |
            packages/desktop/dist/*.exe
          if-no-files-found: error

  # ── Этап 2: smoke-тест установленного артефакта ──────────────────────────
  # Чистый windows-latest: тихая установка NSIS /S, окно GUI, runtime, DLL,
  # max_tokens=16 (регрессия «пустой ответ»), SSE, профили, остановка.
  # Артефакт скачивается из успешной сборки по run_id — llama.cpp не пересобирается.
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke == true
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: litemind-desktop-win-x64
          path: artifact
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer SHA-256 and size
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifact -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'в артефакте нет .exe установщика' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          Write-Host "Размер: $($exe.Length) байт"
          if ($hash -ne '${{ github.event.inputs.expected_sha256 }}') { throw "SHA-256 не совпал: $hash" }
          Add-Content $env:GITHUB_ENV "LM_INSTALLER=$($exe.FullName)"

      - name: Install silently (NSIS /S) and verify runtime files
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:LM_INSTALLER -ArgumentList '/S' -Wait -PassThru
          Write-Host "код завершения установщика: $($p.ExitCode)"
          $base = "$env:LOCALAPPDATA\Programs"
          # productName = LiteMind → по умолчанию %LOCALAPPDATA%\Programs\LiteMind.
          # Ищем надёжно: exe в подпапках Programs (глубина 2), а не по одному имени папки.
          $exe = Get-ChildItem $base -Recurse -Depth 2 -Filter 'LiteMind.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem $base -Directory | ForEach-Object { Write-Host "  найдена папка: $($_.FullName)" }
            throw "LiteMind.exe не найден после установки в $base"
          }
          $dir = $exe.DirectoryName
          Write-Host "папка установки: $dir"
          Add-Content $env:GITHUB_ENV "LM_INSTALL_DIR=$dir"
          $ver = (Get-Item $exe.FullName).VersionInfo.ProductVersion
          Write-Host "версия приложения: $ver"
          if ($ver -notlike '0.6*') { throw "ожидается версия 0.6.x, получено: $ver" }
          $rt = "$dir\resources\llamacpp"
          Get-ChildItem $rt | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          foreach ($f in 'llama-server.exe','llama-server-impl.dll','llama.dll','llama-common.dll',
                         'ggml.dll','ggml-base.dll','ggml-cpu-sse42.dll','ggml-cpu-x64.dll',
                         'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','vcomp140.dll',
                         'libssl-3-x64.dll','libcrypto-3-x64.dll') {
            if (-not (Test-Path "$rt\$f")) { throw "файл runtime отсутствует (0xC0000135-фикс): $f" }
          }
          foreach ($f in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','vcomp140.dll') {
            if (-not (Test-Path "$dir\resources\sd\$f")) { throw "файл runtime отсутствует у sd.exe: $f" }
          }
          # Генератор изображений: sd.exe обязан ехать в установщике (ТЗ v0.6.1 §3).
          $sd = "$dir\resources\sd\sd.exe"
          if (-not (Test-Path $sd)) { throw "sd.exe отсутствует: $sd" }
          $sdver = (& $sd --version 2>&1 | Out-String).Trim()
          Write-Host "sd --version: $sdver"
          if (-not $sdver) { throw 'sd.exe не запустился (несовместимая сборка?)' }

      - name: Download test model (Qwen3-0.6B-Q8_0)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\models" | Out-Null
          curl.exe -sSL --retry 3 -o "$env:RUNNER_TEMP\models\Qwen3-0.6B-Q8_0.gguf" "${{ github.event.inputs.model_url }}"
          $len = (Get-Item "$env:RUNNER_TEMP\models\Qwen3-0.6B-Q8_0.gguf").Length
          Write-Host "модель скачана: $len байт"
          if ($len -lt 100000000) { throw 'файл модели подозрительно мал' }
          Add-Content $env:GITHUB_ENV "LM_MODEL=$env:RUNNER_TEMP\models\Qwen3-0.6B-Q8_0.gguf"
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String | Write-Host

      - name: Direct runtime check (llama-server.exe + health + max_tokens=16 + taskkill)
        shell: pwsh
        run: |
          $rt = "$env:LM_INSTALL_DIR\resources\llamacpp"
          $ver = (& "$rt\llama-server.exe" --version 2>&1 | Out-String).Trim()
          Write-Host "llama-server --version:`n$ver"
          if (-not $ver) { throw 'llama-server.exe не запустился (DLL не загрузились?)' }
          $log = "$env:RUNNER_TEMP\llama-server-direct.log"
          $p = Start-Process -FilePath "$rt\llama-server.exe" `
                 -ArgumentList '-m', $env:LM_MODEL, '--host', '127.0.0.1', '--port', '8398', '-c', '2048' `
                 -RedirectStandardError $log -RedirectStandardOutput "$env:RUNNER_TEMP\llama-server-direct.out.log" `
                 -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..90) {
            try {
              $h = Invoke-RestMethod 'http://127.0.0.1:8398/health' -TimeoutSec 2
              if ($h.status -eq 'ok') { $ok = $true; break }
            } catch { Start-Sleep -Milliseconds 800 }
          }
          if (-not $ok) {
            Get-Content $log -Tail 40 | ForEach-Object { Write-Host "  $_" }
            throw 'llama-server: /health не ответил ok за ~75 с'
          }
          Write-Host 'llama-server: /health ok — модель загружена, DLL работают'
          $body = @{
            model = 'qwen3-test'; stream = $false; max_tokens = 16
            messages = @(@{ role = 'user'; content = 'Ответь одним коротким предложением. Какого цвета небо? /no_think' })
          } | ConvertTo-Json -Depth 5
          $resp = Invoke-RestMethod 'http://127.0.0.1:8398/v1/chat/completions' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 180
          $content = $resp.choices[0].message.content
          Write-Host "ответ (max_tokens=16): $content"
          if (-not $content) { throw 'ПУСТОЙ ответ при max_tokens=16 — регрессия' }
          taskkill /PID $p.Id /T /F
          Start-Sleep -Seconds 2
          $still = Get-Process llama-server -ErrorAction SilentlyContinue
          if ($still) { throw 'llama-server жив после taskkill /T /F' }
          Write-Host 'дерево процессов llama-server корректно завершено'
          Write-Host '--- строки лога llama-server (CPU/бэкенды):'
          Select-String -Path $log -Pattern 'SSE|AVX|backend|CPU|ggml' |
            Select-Object -First 25 | ForEach-Object { Write-Host "  $($_.Line)" }

      - name: Engine smoke (SSE + профили + остановка) на установленном runtime
        shell: pwsh
        run: |
          node packages/litemind-engine/scripts/smoke-stage2.mjs `
            --model "$env:LM_MODEL" `
            --server "$env:LM_INSTALL_DIR\resources\llamacpp\llama-server.exe" `
            --port 8397 --out "$env:RUNNER_TEMP\smoke-engine.json"

      - name: Installed app smoke (LiteMind.exe → движок на 8399)
        shell: pwsh
        run: |
          $cfg = "$env:APPDATA\LiteMind"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          @{
            api = @{ port = 8399 }
            models = @{ rootDir = "$env:RUNNER_TEMP\models" }
            backend = @{ type = 'lmlama' }
            profile = 'balanced'
          } | ConvertTo-Json -Depth 5 | Set-Content "$cfg\config.json" -Encoding utf8NoBOM
          Start-Process "$env:LM_INSTALL_DIR\LiteMind.exe"

          # GUI: окно приложения должно реально появиться (Electron запущен, окно создано)
          $win = $null
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            $win = Get-Process LiteMind -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            if ($win) { break }
          }
          if (-not $win) {
            Get-Process LiteMind -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  процесс LiteMind: PID=$($_.Id), MainWindowHandle=$($_.MainWindowHandle)"
            }
            throw 'окно LiteMind не появилось за 90 с (GUI не создан)'
          }
          Write-Host "окно GUI создано: handle=$($win.MainWindowHandle), заголовок='$($win.MainWindowTitle)'"
          # Даём интерфейсу отрисоваться: CI-сессия без GPU, Electron рендерит
          # софтверно, на слабом старте белый кадр — норма в первые секунды.
          Start-Sleep -Seconds 20
          # Скриншот рабочего стола (best-effort: доказательство GUI для отчёта).
          # Окно поднимаем на передний план, чтобы снять именно LiteMind.
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);' -Name Win32 -Namespace Native
            [Native.Win32]::SetForegroundWindow($win.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\litemind-gui.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "скриншот сохранён: $env:RUNNER_TEMP\litemind-gui.png"
          } catch { Write-Host "::warning::скриншот не удался: $($_.Exception.Message)" }

          node packages/litemind-engine/scripts/smoke-stage2-gui.mjs --out "$env:RUNNER_TEMP\smoke-gui.json"
          $exit = $LASTEXITCODE

          # ── ТЗ v0.6.1: AI Agent — реальная многошаговая задача на живой модели,
          # пока приложение запущено (движок на 8399). Уточнение + остановка + история.
          Write-Host '=== AI Agent smoke: реальная задача с инструментами ==='
          node packages/litemind-engine/scripts/smoke-stage2-agent.mjs --model "Qwen3-0.6B-Q8_0" --port 8399 --out "$env:RUNNER_TEMP\smoke-agent.json"
          $agentExit = $LASTEXITCODE
          Write-Host "agent smoke код: $agentExit"

          # ── ТЗ v0.6.2: Model Discovery — реальная проверка источников (HF),
          # карточки с оценкой по железу, скачивание найденной модели кнопкой
          # из приложения (общий загрузчик + SHA-256) + Projects/Workspace/Terminal.
          Write-Host '=== Model Discovery smoke: источники + скачивание ==='
          node packages/litemind-engine/scripts/smoke-stage3-discovery.mjs --port 8399 --out "$env:RUNNER_TEMP\smoke-discovery.json"
          $discoExit = $LASTEXITCODE
          Write-Host "discovery smoke код: $discoExit"

          # ── ТЗ v0.6.1 §3: Генератор изображений — реальная генерация через
          # API установленного приложения (sd.exe из установщика, модель по кнопке).
          Write-Host '=== Image Generator smoke: реальная генерация 256x256 ==='
          $ig = Invoke-RestMethod 'http://127.0.0.1:8399/api/image/status' -TimeoutSec 10
          Write-Host "image backend found: $($ig.backend.found), версия: $($ig.backend.version)"
          if (-not $ig.backend.found) { throw 'sd.exe не обнаружен установленным приложением' }
          # Небольшая модель для smoke: SD 1.5 Q4_0 (~1.5 ГБ) с официального источника каталога.
          # Каталог image-моделей берём из статуса бэкенда (modelsDir): imageGen
          # сканирует только его (<root>\image), а не общий каталог текстовых
          # моделей (прогон №5: модель в корне rootDir → MODEL_NOT_FOUND).
          $sdDir = $ig.modelsDir
          Write-Host "каталог image-моделей: $sdDir"
          New-Item -ItemType Directory -Force $sdDir | Out-Null
          $sdModel = Join-Path $sdDir 'sd15-q4_0.gguf'
          if (-not (Test-Path $sdModel)) {
            curl.exe -sSL --retry 3 -o "$sdModel.part" 'https://huggingface.co/second-state/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf'
            Move-Item "$sdModel.part" $sdModel
          }
          $sdLen = (Get-Item $sdModel).Length
          Write-Host "sd-модель: $sdLen байт"
          if ($sdLen -lt 1000000000) { throw 'sd-модель подозрительно мала' }
          $gen = Invoke-RestMethod 'http://127.0.0.1:8399/api/image/generate' -Method Post -ContentType 'application/json' -Body (@{
            modelFile = $sdModel; prompt = 'a small red apple on a white table'; width = 256; height = 256; steps = 6; cfg = 7; seed = 42
          } | ConvertTo-Json -Depth 4) -TimeoutSec 60
          Write-Host "задание генерации: $($gen.job.id), состояние: $($gen.job.state)"
          $imgDone = $false
          foreach ($i in 1..100) {
            Start-Sleep -Seconds 6
            $st = Invoke-RestMethod 'http://127.0.0.1:8399/api/image/job' -TimeoutSec 10
            Write-Host ("  фаза: {0}, {1}%, прошло {2} c" -f $st.job.phase, $st.job.percent, [int]($st.job.elapsedMs / 1000))
            if ($st.job.state -eq 'done') { $imgDone = $true; break }
            if ($st.job.state -eq 'error') { throw "генерация изображения упала: $($st.job.error)" }
          }
          if (-not $imgDone) { throw 'генерация изображения не завершилась за ~10 мин' }
          $gal = Invoke-RestMethod 'http://127.0.0.1:8399/api/image/gallery' -TimeoutSec 10
          if (-not $gal.items -or $gal.items.Count -lt 1) { throw 'галерея пуста после генерации' }
          $item = $gal.items[0]
          Write-Host "изображение: $($item.name), $($item.width)x$($item.height), seed $($item.seed), время $([int]($item.durationMs / 1000)) c"
          # PNG обязан реально отдаваться и быть валидным (сигнатура).
          $png = Invoke-WebRequest "http://127.0.0.1:8399/api/image/file?name=$($item.name)" -TimeoutSec 15
          if ($png.Content.Length -lt 8 -or $png.Content[0] -ne 0x89 -or $png.Content[1] -ne 0x50 -or $png.Content[2] -ne 0x4E -or $png.Content[3] -ne 0x47) {
            throw "файл в галерее не PNG (сигнатура не 89 50 4E 47)"
          }
          Write-Host "PNG получен ($($png.Content.Length) байт), генератор изображений работает"
          Write-Host 'PNG получен, генератор изображений работает'

          taskkill /IM LiteMind.exe /T /F 2>$null
          Start-Sleep -Seconds 3
          $app = Get-Process LiteMind -ErrorAction SilentlyContinue
          if ($app) { throw 'LiteMind.exe не завершился' }
          if ($exit -ne 0 -or $agentExit -ne 0 -or $discoExit -ne 0) {
            Get-ChildItem "$env:APPDATA\LiteMind\logs" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "=== $($_.Name)"; Get-Content $_.FullName -Tail 30 | ForEach-Object { Write-Host "  $_" } }
            throw "smoke завершился с кодом: gui=$exit, agent=$agentExit, discovery=$discoExit"
          }
          Write-Host 'приложение запустилось, отработало и корректно завершено'

      - name: Uninstall preserves user data, reinstall works (ТЗ §1.6–1.7)
        shell: pwsh
        run: |
          $base = "$env:LM_INSTALL_DIR"
          if (-not $base) { throw 'LM_INSTALL_DIR не задан (прошлый шаг не выполнился?)' }
          # Маркер пользовательских данных в %APPDATA%\LiteMind (конфиг уже создан smoke-шагом)
          $dataDir = "$env:APPDATA\LiteMind"
          if (-not (Test-Path "$dataDir\config.json")) { throw 'config.json отсутствует перед удалением — неожиданно' }
          Set-Content "$dataDir\user-marker.txt" 'пользовательские данные должны пережить удаление' -Encoding utf8
          $modelFile = "$env:RUNNER_TEMP\models\Qwen3-0.6B-Q8_0.gguf"
          if (-not (Test-Path $modelFile)) { throw 'файл модели отсутствует перед удалением' }

          # 1) Тихое удаление: Uninstall LiteMind.exe /S
          $unins = Get-ChildItem $base -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $unins) { throw 'деинсталлятор не найден' }
          Write-Host "деинсталлятор: $($unins.FullName)"
          $p = Start-Process -FilePath $unins.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "код удаления: $($p.ExitCode)"
          Start-Sleep -Seconds 4
          $left = Get-ChildItem (Split-Path $base -Parent) -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -eq $base }
          if ($left -and (Test-Path "$base\LiteMind.exe")) { throw 'приложение всё ещё на месте после удаления' }
          Write-Host 'папка приложения удалена'

          # 2) Пользовательские данные НЕ удаляются (ТЗ §1): конфиг, маркер, модели
          if (-not (Test-Path "$dataDir\config.json")) { throw 'ДАННЫЕ ПОТЕРЯНЫ: config.json удалён' }
          if (-not (Test-Path "$dataDir\user-marker.txt")) { throw 'ДАННЫЕ ПОТЕРЯНЫ: пользовательский файл удалён' }
          if (-not (Test-Path $modelFile)) { throw 'ДАННЫЕ ПОТЕРЯНЫ: скачанная модель удалена' }
          Write-Host 'пользовательские данные пережили удаление (config.json, маркер, модель)'

          # 3) Повторная установка поверх (обновление)
          $p2 = Start-Process -FilePath $env:LM_INSTALLER -ArgumentList '/S' -Wait -PassThru
          Write-Host "код переустановки: $($p2.ExitCode)"
          Start-Sleep -Seconds 2
          $exe2 = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter 'LiteMind.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe2) { throw 'повторная установка не удалась: LiteMind.exe не найден' }
          $ver2 = (Get-Item $exe2.FullName).VersionInfo.ProductVersion
          Write-Host "переустановлено: $($exe2.DirectoryName), версия $ver2"
          if (-not (Test-Path "$dataDir\user-marker.txt")) { throw 'после переустановки пропал пользовательский маркер' }
          Write-Host 'переустановка поверх старой: пользовательские данные на месте'

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litemind-windows-smoke-results
          path: |
            ${{ runner.temp }}/smoke-engine.json
            ${{ runner.temp }}/smoke-gui.json
            ${{ runner.temp }}/smoke-agent.json
            ${{ runner.temp }}/smoke-discovery.json
            ${{ runner.temp }}/llama-server-direct.log
            ${{ runner.temp }}/litemind-gui.png
          if-no-files-found: ignore

  release:
    needs: [test, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          name: litemind-desktop-win-x64
          path: dist
      - name: Verify artifacts exist and are non-empty
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.exe' -size +10M)" || { echo '::error::No substantial .exe found in artifacts'; exit 1; }
      - name: Compute SHA-256 checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiteMind Engine ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

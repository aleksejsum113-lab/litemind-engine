name: LiteMind Windows build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      - '.github/**'
      - '**/*.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun строго той версии, что закреплена в packageManager (bun@1.4.4) —
      # из npm-реестра: GitHub Releases периодически отдаёт 504 (инцидент 2026-11-08).
      - name: Install bun 1.4.4 (npm registry)
        run: npm install -g bun@1.4.4
      - run: bun install --ignore-scripts
      - name: Engine tests
        working-directory: packages/litemind-engine
        run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install bun 1.4.4 (npm registry)
        run: npm install -g bun@1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install
      # Версия сборки: из тега (v0.5.0 -> 0.5.0), для веток — из package.json
      # (источник истины), с суффиксом -dev для ветки dev.
      - name: Derive version
        id: ver
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./packages/litemind-engine/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "version=${PKG_VERSION}-dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build CLI sidecar
        working-directory: packages/cli
        run: bun run build
      # Собственный runtime v0.4+: llama.cpp без AVX/AVX2 как ТРЕБОВАНИЕ
      # совместимости (целевой CPU — Intel N5095A/Tremont), но с GGML_CPU_ALL_VARIANTS:
      # в комплект кладутся варианты CPU-ядра (x64/sse42/avx2/...), и runtime сам
      # выбирает лучший вариант, который поддерживает процессор пользователя.
      # На N5095A будет задействован sse42 (быстрее базового x86-64),
      # на AVX2-машинах — haswell. Сборка остаётся полностью работоспособной
      # на CPU без AVX (ТЗ Этапа 2 §4: проверка реальных инструкций, а не запрет).
      # ВАЖНО: BUILD_SHARED_LIBS не выключаем — upstream требует общие библиотеки
      # для GGML_BACKEND_DL (ggml/src/CMakeLists.txt: «GGML_BACKEND_DL requires
      # BUILD_SHARED_LIBS», падение CI 2026-11-10). Все ggml*.dll копируются рядом
      # с exe и попадают в установщик тем же шагом.
      - name: Build llama.cpp runtime (no AVX baseline + runtime CPU variants)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp "$env:RUNNER_TEMP\llamacpp-src"
          cmake -S "$env:RUNNER_TEMP\llamacpp-src" -B "$env:RUNNER_TEMP\llamacpp-build" `
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_SSE42=OFF `
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF `
            -DGGML_AVX_VNNI=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TOOLS=ON -DLLAMA_CURL=OFF `
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON
          cmake --build "$env:RUNNER_TEMP\llamacpp-build" --config Release --target llama-server
          New-Item -ItemType Directory -Force packages/desktop/resources/llamacpp | Out-Null
          $exe = Get-ChildItem "$env:RUNNER_TEMP\llamacpp-build\bin" -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw 'llama-server.exe was not built' }
          Copy-Item $exe.FullName packages/desktop/resources/llamacpp/llama-server.exe
          # BACKEND_DL + общие библиотеки: ggml-бэкенды и варианты CPU (ggml-cpu-*.dll)
          # идут отдельными DLL рядом с exe — копируем их все.
          Get-ChildItem $exe.DirectoryName -Filter *.dll | ForEach-Object { Copy-Item $_.FullName packages/desktop/resources/llamacpp/ }
          Get-ChildItem packages/desktop/resources/llamacpp | Select-Object Name, Length
      - name: Build desktop
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
        run: bun run build
      - name: Package NSIS installer (x64)
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          # Ресурсы electron-builder (winCodeSign, NSIS) качаются с зеркала npmmirror:
          # GitHub Releases периодически отдаёт 504 (два прогона подряд).
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          # Zip дистрибутива Electron тоже качается с GitHub Releases — зеркало снимает зависимость от его стабильности.
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts
      # Portable-таргет временно не собирается: патч апстрима app-builder-lib
      # использует ${DirState} из assisted-шаблона, которого нет в oneClick/portable.
      - name: List build output (verification)
        shell: pwsh
        run: Get-ChildItem packages/desktop/dist -Filter *.exe | Select-Object Name, Length
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litemind-desktop-win-x64
          path: |
            packages/desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: [test, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          name: litemind-desktop-win-x64
          path: dist
      - name: Verify artifacts exist and are non-empty
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.exe' -size +10M)" || { echo '::error::No substantial .exe found in artifacts'; exit 1; }
      - name: Compute SHA-256 checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiteMind Engine ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
